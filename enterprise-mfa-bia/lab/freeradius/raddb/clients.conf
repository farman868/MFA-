# RADIUS clients (NAS). Only the OpenVPN server and local health checks may query this server.
client openvpn-gateway {
	ipaddr = 0.0.0.0/0
	secret = __RADIUS_SHARED_SECRET__
	shortname = openvpn-gateway
	require_message_authenticator = no
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}
