# Enterprise Corp lab remote-access VPN.
# Client authentication = username + (password AND one-time code), checked through RADIUS -> mfa-otp-bridge -> Keycloak.
port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0

ca   /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/vpn-gateway.crt
key  /etc/openvpn/pki/private/vpn-gateway.key
dh   none
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

# Username/password (+OTP) authentication instead of per-user client certificates.
verify-client-cert none
username-as-common-name
script-security 2
auth-user-pass-verify /etc/openvpn/radius-verify.sh via-file
# 8h session token so users are not re-prompted for an OTP on TLS renegotiation / reconnect
auth-gen-token 28800
reneg-sec 0

keepalive 10 60
user nobody
group nogroup
persist-key
persist-tun
status /tmp/openvpn-status.log 10
verb 3
