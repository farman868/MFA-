client
dev tun
proto udp
remote openvpn 1194
resolv-retry 5
nobind
ca /etc/openvpn/client-share/ca.crt
remote-cert-tls server
verify-x509-name vpn-gateway name
auth-user-pass /tmp/auth.txt
auth-nocache
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
verb 3
# Interactive users would instead use:  static-challenge "Enter your authenticator code" 1
