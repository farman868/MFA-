# Enterprise MFA lab — CI/CD
#
#   static-checks  (~2 min)  Python/shell/XML/JSON/compose checks + compiles the Keycloak Java SPI with Maven.
#   lab-e2e        (~25-40 min) builds and starts the full Docker lab on the runner, then runs
#                  baseline assessment -> 18 verification checks -> IR drill -> usage report.
#
# Results: job summary (Actions run page) + artifacts:
#   mfa-project-deliverables-and-evidence  docs/ (incl. evidence/ and the drill report inserted into doc 06), policies/
#   mfa-lab-diagnostics                    container logs, compose state, Wazuh logs (for troubleshooting)
#
# Optional repository secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (avoid Docker Hub pull rate limits).
# Manual run option "commit_evidence" pushes the generated evidence to a branch ci-evidence/run-<id>.

name: Enterprise MFA Lab Verification & IR Drill

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/evidence/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_vpn_tunnel:
        description: "Skip the OpenVPN tunnel test (check 13)"
        type: boolean
        default: false
      commit_evidence:
        description: "Commit docs/evidence and the updated doc 06 to branch ci-evidence/run-<id>"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mfa-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks + SPI compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install --quiet ruff

      - name: Static checks (Python, shell, XML, realm JSON, compose, line endings)
        run: bash scripts/ci/static_checks.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: lab/keycloak/providers/mfa-bridge-authenticator/pom.xml

      - name: Compile Keycloak SPI (fails fast on Java errors before the heavy job)
        working-directory: lab/keycloak/providers/mfa-bridge-authenticator
        run: mvn -B -q package -DskipTests && ls -l target/*.jar

  lab-e2e:
    name: Lab end-to-end (assessment, verification, IR drill)
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner (~20 GB of preinstalled SDKs not needed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Runner facts
        run: |
          nproc; free -m
          docker version --format 'Docker {{.Server.Version}}'; docker compose version
          python3 --version
          ls -l /dev/net/tun || echo "WARNING: /dev/net/tun missing - VPN tunnel test will fail"

      - name: Log in to Docker Hub (only if secrets are configured)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure executable bits and LF endings (repos uploaded from Windows lose them)
        run: |
          find scripts lab -name '*.sh' -exec chmod +x {} +
          chmod +x scripts/*.py scripts/ci/*.py
          find scripts lab -type f \( -name '*.sh' -o -name '*.py' -o -name '*.conf' -o -name rest -o -name mfa-site \) -exec sed -i 's/\r$//' {} +

      - name: Pre-pull base images in parallel
        run: |
          docker compose --project-directory lab -f lab/docker-compose.yml --env-file lab/.env.example \
            pull --ignore-buildable --ignore-pull-failures --quiet || true

      - name: Run lab - setup, baseline assessment, verification, IR drill, usage report
        id: run
        env:
          VERIFY_ARGS: ${{ inputs.skip_vpn_tunnel && '--skip-vpn-tunnel' || '' }}
        run: ./scripts/run_all.sh

      - name: Job summary
        if: always()
        run: python3 scripts/ci/summary.py

      - name: Collect diagnostics
        if: always()
        run: bash scripts/ci/collect_diagnostics.sh

      - name: Upload deliverables and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfa-project-deliverables-and-evidence
          path: |
            docs/
            policies/
            README.md
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfa-lab-diagnostics
          path: diagnostics/
          retention-days: 14

      - name: Teardown
        if: always()
        run: ./scripts/teardown_lab.sh --purge

  commit-evidence:
    name: Commit evidence to a branch (manual runs only)
    needs: lab-e2e
    if: github.event_name == 'workflow_dispatch' && inputs.commit_evidence && always() && needs.lab-e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfa-project-deliverables-and-evidence
          path: .ci-artifact
      - name: Push docs/ from the run to ci-evidence/run-${{ github.run_id }}
        run: |
          cp -r .ci-artifact/docs/. docs/ && rm -rf .ci-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ci-evidence/run-${{ github.run_id }}"
          git add -f docs/
          git commit -m "CI evidence from run ${{ github.run_id }} (verification, IR drill, usage report)" || { echo "nothing to commit"; exit 0; }
          git push origin "ci-evidence/run-${{ github.run_id }}"
